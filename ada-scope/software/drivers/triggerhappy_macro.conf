# Main Keys
# 1: Pre-session Horizontal Slew for Collimation
KEY_F1+KEY_LEFTCTRL+KEY_LEFTALT+KEY_LEFTSHIFT    1    /usr/bin/python3 /home/drew/scripts/collimation_slew.py

# 2: Park Scope
KEY_F2+KEY_LEFTCTRL+KEY_LEFTALT+KEY_LEFTSHIFT    1    /usr/bin/python3 /home/drew/scripts/park_scope.py

# 3: Post-session Shutdown Sequence
KEY_F3+KEY_LEFTCTRL+KEY_LEFTALT+KEY_LEFTSHIFT    1    sudo /home/drew/scripts/shutdown_sequence.sh

# Focuser Micro-Stepping (Passes the tick amount to the script)
KEY_VOLUMEUP      1    /usr/bin/python3 /home/drew/scripts/focus_step.py 50
KEY_VOLUMEDOWN    1    /usr/bin/python3 /home/drew/scripts/focus_step.py -50

# The Emergency Abort Knob Press
KEY_F3+KEY_LEFTCTRL+KEY_LEFTALT+KEY_LEFTSHIFT   1    /usr/bin/python3 /home/drew/scripts/abort_slew.py
