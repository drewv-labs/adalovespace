---
---
- name: Install MQTT client utilities for local debugging
  apt:
    name: mosquitto-clients
    state: present
    update_cache: yes

- name: Create carrierpigeons system user
  user:
    name: carrierpigeons
    system: yes
    create_home: no
    shell: /usr/sbin/nologin

- name: Ensure install directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: carrierpigeons
    group: carrierpigeons
    mode: '0755'
  loop:
    - "{{ carrierpigeons_install_path }}/bin"
    - "{{ carrierpigeons_install_path }}/config"

- name: Deploy CarrierPigeons Go binary
  # This assumes you compile the binary on your control node and place it in roles/common_carrierpigeons/files/
  copy:
    src: files/carrierpigeons
    dest: "{{ carrierpigeons_install_path }}/bin/carrierpigeons"
    owner: carrierpigeons
    group: carrierpigeons
    mode: '0755'
  notify: restart carrierpigeons

- name: Deploy systemd service unit
  template:
    src: carrierpigeons.service.j2
    dest: /etc/systemd/system/carrierpigeons.service
    owner: root
    group: root
    mode: '0644'
  notify: restart carrierpigeons

- name: Ensure CarrierPigeons is enabled and running
  systemd:
    name: carrierpigeons
    state: started
    enabled: yes
    daemon_reload: yes
