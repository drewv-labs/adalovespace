---
# TODO: Configure PostgreSQL, NFS, MQTT broker, and NTFY
---
# ==============================================================================
# 1. PostgreSQL Configuration
# ==============================================================================
- name: Install PostgreSQL server and Ansible dependencies
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2  # Required for Ansible postgresql_* modules
      - acl               # Needed for become_user: postgres
    state: present
    update_cache: yes

- name: Ensure PostgreSQL service is enabled and running
  systemd:
    name: postgresql
    state: started
    enabled: yes

- name: Create telemetry database
  become: true
  become_user: postgres
  postgresql_db:
    name: telemetry_db
    state: present

- name: Create telemetry database user
  become: true
  become_user: postgres
  postgresql_user:
    db: telemetry_db
    name: telemetry_user
    password: password  # Update for production or move to Ansible Vault
    priv: ALL
    state: present

# ==============================================================================
# 2. NFS Server Configuration
# ==============================================================================
- name: Install NFS kernel server
  apt:
    name: nfs-kernel-server
    state: present

- name: Create NFS export directory for astrophotography data
  file:
    path: /srv/nfs/astro
    state: directory
    owner: nobody
    group: nogroup
    mode: '0777'

- name: Configure NFS exports
  lineinfile:
    path: /etc/exports
    line: "/srv/nfs/astro 192.168.1.0/24(rw,sync,no_subtree_check,no_root_squash)"
    state: present
  notify: restart nfs

# ==============================================================================
# 3. Mosquitto MQTT Broker Configuration
# ==============================================================================
- name: Install Mosquitto MQTT Broker
  apt:
    name:
      - mosquitto
      - mosquitto-clients
    state: present

- name: Configure Mosquitto listener to accept OpenWrt subnet connections
  copy:
    dest: /etc/mosquitto/conf.d/default.conf
    content: |
      listener 1883 0.0.0.0
      allow_anonymous true
    mode: '0644'
  notify: restart mosquitto

- name: Ensure Mosquitto service is enabled and running
  systemd:
    name: mosquitto
    state: started
    enabled: yes

# ==============================================================================
# 4. NTFY Server Configuration
# ==============================================================================
- name: Install dependencies for NTFY repository
  apt:
    name:
      - curl
      - gnupg
      - apt-transport-https
    state: present

- name: Create apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download NTFY GPG key
  ansible.builtin.get_url:
    url: https://archive.ntfy.sh/apt/keyring.gpg
    dest: /etc/apt/keyrings/ntfy.gpg
    mode: '0644'

- name: Add NTFY APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/ntfy.gpg] https://archive.ntfy.sh/apt stable main"
    state: present
    filename: ntfy
    update_cache: yes

- name: Install NTFY server
  apt:
    name: ntfy
    state: present

- name: Ensure NTFY service is enabled and running
  systemd:
    name: ntfy
    state: started
    enabled: yes

# ==============================================================================
# 5. FastMCP Gateway Deployment
# ==============================================================================
- name: Ensure MCP server directory exists
  file:
    path: /opt/mcp-jakebase
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Deploy FastMCP server.py
  copy:
    src: files/server.py
    dest: /opt/mcp-jakebase/server.py
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  notify: restart mcp-gateway

- name: Initialize uv project and install FastMCP dependencies
  ansible.builtin.command: "{{ item }}"
  args:
    chdir: /opt/mcp-jakebase
  loop:
    - uv init --no-workspace
    - uv add mcp asyncpg aiomqtt pydantic
  creates: /opt/mcp-jakebase/pyproject.toml

- name: Deploy FastMCP systemd service unit
  template:
    src: templates/mcp-gateway.service.j2
    dest: /etc/systemd/system/mcp-gateway.service
    owner: root
    group: root
    mode: '0644'
  notify: restart mcp-gateway

- name: Ensure FastMCP gateway is enabled and running
  systemd:
    name: mcp-gateway
    state: started
    enabled: yes
    daemon_reload: yes
