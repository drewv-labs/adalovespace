[network]
node = "radiawrt"
subnet = "10.42.0.x"
gateway = "10.42.0.1"

# === NODES === #
[nodes.radiawrt]
id = "1"
hardware = "OpenWrtOne"
role = "network_manager"

[nodes.adabrain]
id = "10"
hardware = "RaspberryPi5"
role = "data_broker"

[nodes.maryguider]
id = "20"
hardware = "RaspberryPiZero2W"
role = "guiding_engine"

[nodes.margaret]
id = "77"
hardware = "HunsnN100"
role = "maestro"

[nodes.caroline-v]
id = "88"
hardware = "VisionFive2-Hailo8L"
role = "inference"

[nodes.jakebase]
id = "99"
hardware = "RaspberryPi5"
role = "data_broker"

# === SERVICES === #
[services.kstars-ekos]
node = "margaret"

[services.indi-web]
node = "adabrain"

[services.mqtt]
node = "jakebase"
port = 1883
root_topic = "adaspace"
sub_topics = "issues events metadata telemetry"

[services.nfs]
node = "jakebase"
root = "ada"
share = "sharespace"
code = "codespace"
wheel = "wheelspace"

[services.nomachine]
node = "margaret"
v_major = "9"
v_minor = "7"
v_patch = "3"
v_build = "1"

[services.phd2]
node = "maryguider"

[services.psql]
node = "jakebase"
port = 5432
database = "adaspace"
table = "staging"
mqtt_dest_field = "payload"
mqtt_timestamp = "event_timestamp"

[[services.psql.user]]
name = "cluster_agent"
password = "fustercluck"

[[services.psql.user]]
name = "coffee_courier"
password = "starsucks"

[services.telegraf]
interval = "1s"
flush_interval = "1s"
omit_hostname = "false"
metric_batch_size = 500
metric_buffer_limit = 10000
